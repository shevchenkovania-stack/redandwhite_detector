name: lamp_detection
description: "Счёт попаданий по двум сигнальным лампам (белая и красная) через камеру: извлечение признаков, гистерезисный детектор, offline-first SQLite-очередь доставки."
version: 0.1.0
repository: https://github.com/shevchenkovania-stack/redandwhite_detector
issue_tracker: https://github.com/shevchenkovania-stack/redandwhite_detector/issues
topics:
  - computer-vision
  - camera
  - detection

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

# Ресурсов и шрифтов у пакета нет — секция `flutter:` не нужна.
